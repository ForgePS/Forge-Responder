<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      // FORGE Field (/field or /<department>/field): installable app with offline support.
      (function () {
        var parts = location.pathname.split("/").filter(Boolean);
        var isField = (parts.length === 1 && parts[0] === "field") || (parts.length === 2 && parts[1] === "field");
        if (!isField) return;
        var head = document.head;
        var manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = "/field.webmanifest";
        head.appendChild(manifest);
        var touch = document.createElement("link");
        touch.rel = "apple-touch-icon";
        touch.href = "/field-apple-touch-icon.png";
        head.appendChild(touch);
        var capable = document.createElement("meta");
        capable.name = "apple-mobile-web-app-capable";
        capable.content = "yes";
        head.appendChild(capable);
        var title = document.createElement("meta");
        title.name = "apple-mobile-web-app-title";
        title.content = "FORGE Field";
        head.appendChild(title);
        try {
          var pref = localStorage.getItem("forge-field-theme");
          var dark = pref === "dark" || (pref !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-field-theme", dark ? "dark" : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-field-theme", "light");
        }
      })();
    </script>
    <script>
      document.documentElement.setAttribute("data-theme", "dark");
      (function () {
        var path = location.pathname.replace(/\/$/, "") || "/";
        var isAlert = path === "/alerts" || path.endsWith("/alerts");
        if (!isAlert) return;
        document.documentElement.setAttribute("data-theme", "dark");
        window.__FORGE_ALERT_DASHBOARD__ = true;
        var lockedPath = location.pathname + location.search;
        var replaceState = history.replaceState.bind(history);
        var pushState = history.pushState.bind(history);
        function guardUrl(url) {
          if (!url) return lockedPath;
          var next = String(url);
          if (next.includes("/alerts")) return url;
          return lockedPath;
        }
        history.replaceState = function (state, title, url) {
          return replaceState(state, title, guardUrl(url));
        };
        history.pushState = function (state, title, url) {
          return pushState(state, title, guardUrl(url));
        };
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>FORGE Public Safety RMS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
